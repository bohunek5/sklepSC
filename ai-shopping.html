<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1a30">
  <link rel="icon" type="image/png" href="images/prescot-pattern.png">
  <title>Zakup AI | Prescot LED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/configurator.css">
  
  <style>
    /* Futuristic AI Chat Design - LLM Style */
    body.ai-shopping-body {
      background: #0f172a !important; /* Ciemny, elegancki granat podobny do IDE/LLM */
      color: #fff !important;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      margin: 0;
    }
    
    .site-header {
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .ai-hero {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end; /* Chat box starts near bottom or stretches */
      padding: 100px 20px 40px;
      z-index: 1;
      min-height: calc(100vh - 75px);
    }

    /* Watermark background */
    .ai-hero::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50vw;
      height: 50vw;
      max-width: 500px;
      max-height: 500px;
      background: url('images/logo-white.png') center/contain no-repeat;
      opacity: 0.035; /* Static clean faint watermark */
      z-index: 0;
      pointer-events: none;
    }

    

    /* Chat window styled like a pro LLM */
    .ai-chat-interface {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      height: 100%;
      flex: 1;
    }

    .chat-history {
      display: flex;
      flex-direction: column;
      gap: 24px;
      flex: 1;
      overflow-y: auto;
      padding: 20px 0 40px;
    }

    .chat-history::-webkit-scrollbar {
      width: 6px;
    }
    .chat-history::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
    }

    .chat-message {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      animation: fadeInUp 0.4s ease forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-ai {
      background: #ffffff;
      color: #fff;
    }

    .avatar-user {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .message-bubble {
      padding: 0;
      font-size: 15px;
      line-height: 1.6;
      color: #e2e8f0;
      flex: 1;
      margin-top: 4px;
    }

    /* AI input styled like LLM prompt box */
    
    /* --- AI STUDIO GOOGLE STYLE INPUT BAR --- */
    .ai-input-area {
      position: relative;
      margin-top: auto;
      background: #1e293b; /* Base dark background */
      border-radius: 30px; /* Fully rounded pill shape like AI Studio */
      padding: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      z-index: 1; /* For the halo pseudo-elements */
    }

    .ai-input-area input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 16px 60px 16px 24px; /* More padding, room for button */
      color: #fff;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      outline: none;
    }

    .ai-input-area input::placeholder {
      color: #94a3b8;
    }

    /* Send Button */
    .ai-input-area button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 8px;
      width: 44px; /* Larger circular button */
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05); /* Subtle background initially */
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .ai-input-area button:hover {
      background: #ff5a00; /* The brand orange */
      border-color: #ff5a00;
      box-shadow: 0 4px 15px rgba(255, 90, 0, 0.4);
    }
    
    .ai-input-area button:hover img {
      filter: brightness(0) invert(1);
    }

    /* AI Studio Spinning Halo Effect */
    @property --halo-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    
    .ai-input-area::before {
      content: "";
      position: absolute;
      inset: -2px; /* Slightly thicker border for AI Studio look */
      border-radius: 32px; /* Matches the inner pill */
      padding: 2px; /* Border thickness */
      background: rgba(11, 26, 48, 0.8); /* Dark navy base */
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: -1;
    }

    .ai-input-area::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 32px;
      padding: 2px;
      background: conic-gradient(
        from var(--halo-angle, 0deg), 
        rgba(5, 12, 25, 1) 0%,         /* Very dark navy */
        rgba(5, 12, 25, 1) 40%, 
        rgba(11, 26, 48, 1) 60%,       /* Deep navy */
        rgba(255, 90, 0, 0.7) 80%,    /* Brand orange fading in */
        #ff5a00 95%,                   /* Pure brand orange */
        rgba(5, 12, 25, 1) 100%        /* Seamless loop to dark navy */
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: -1;
    }

    .ai-input-area.focused::before {
      opacity: 0;
    }
    .ai-input-area.focused::after {
      opacity: 1;
      animation: spinHalo 4s linear infinite; /* Smooth 4s rotation */
    }
    .ai-input-area.focused {
      box-shadow: 0 8px 30px rgba(11, 26, 48, 0.5), 0 0 15px rgba(255, 90, 0, 0.15);
      background: #151e2e; /* Slightly darker background when focused */
    }

    @keyframes spinHalo {
      to { --halo-angle: 360deg; }
    }
    /* --- END AI STUDIO STYLE --- */

</style>

<style id="global-premium-overrides">
/* Premium Footer CSS */
.premium-footer {
  background: var(--primary-color, #0b1a30) !important;
  color: #fff !important;
  padding: 80px 8% 40px !important;
  border-top: 1px solid rgba(255,255,255,0.05);
  font-family: 'Outfit', sans-serif;
  margin-top: auto;
}
.premium-footer .footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1.5fr;
  gap: 60px;
  margin-bottom: 60px;
}
.premium-footer .footer-logo img {
  height: 38px !important;
  opacity: 1 !important;
  margin-bottom: 25px;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
}
.premium-footer .brand-desc {
  color: rgba(255,255,255,0.6);
  line-height: 1.7;
  font-size: 15px;
  margin-bottom: 25px;
}
.premium-footer .social-links {
  display: flex;
  gap: 15px;
}
.premium-footer .social-links a {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
  color: #fff;
  font-size: 20px;
  transition: all 0.3s ease;
}
.premium-footer .social-links a:hover {
  background: var(--accent-color, #ff5a00);
  transform: translateY(-3px);
}
.premium-footer h3 {
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 25px;
  letter-spacing: 1px;
}
.premium-footer ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
.premium-footer ul li {
  margin-bottom: 12px;
}
.premium-footer ul li a {
  color: rgba(255,255,255,0.7);
  text-decoration: none;
  font-size: 15px;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
}
.premium-footer ul li a:hover {
  color: #fff;
  transform: translateX(5px);
}
.premium-footer .contact-info li {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  color: rgba(255,255,255,0.7);
  font-size: 15px;
  line-height: 1.6;
}
.premium-footer .contact-info i {
  font-size: 20px;
  color: var(--accent-color, #ff5a00);
  margin-top: 2px;
}
.premium-footer .footer-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 30px;
  border-top: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.5);
  font-size: 13px;
}
.premium-footer .payment-methods {
  display: flex;
  gap: 15px;
  font-size: 24px;
  color: rgba(255,255,255,0.5);
}
@media (max-width: 992px) {
  .premium-footer .footer-grid {
    grid-template-columns: 1fr 1fr;
    gap: 40px;
  }
}
@media (max-width: 768px) {
  .premium-footer .footer-grid {
    grid-template-columns: 1fr;
    gap: 35px;
  }
  .premium-footer .footer-bottom {
    flex-direction: column;
    gap: 20px;
    text-align: center;
  }
}

/* Logo Header Fix */
.site-header .brand {
  display: flex !important;
  align-items: center !important;
  height: 100%;
}
.site-header .brand img {
  height: 28px !important;
  max-width: none !important;
  object-fit: contain !important;
  transform: none;
}
@media (max-width: 768px) {
  .site-header .brand img {
    height: 32px !important;
  }
}
</style>

</head>
<body class="ai-shopping-body">

  <!-- Include existing header here via JS injection or python -->
  <header class="site-header" id="siteHeader">
    <a class="brand" href="index.html" aria-label="Prescot — strona główna">
      <img src="images/logo-white.png" data-dark="images/logo-dark.png" data-light="images/logo-white.png" alt="Prescot">
    </a>
    <nav class="desktop-nav" aria-label="Nawigacja główna">
      <a href="index.html">Home</a>
      <a href="shop.html">Sklep</a>
      <a href="blog.html">Wiedza</a>
      <a href="about.html">O nas</a>
      <a href="contact.html">Kontakt</a>
      <a href="configurator.html">Dobierz system</a>
      <a class="active" href="ai-shopping.html"><img class="gemini-icon" src="images/prescot-pattern.png" style="width: 18px; height: 18px; object-fit: contain; margin-right: 6px; vertical-align: middle;">Zakup AI</a>
    </nav>
    <div class="header-actions">
        <form class="header-search" action="shop.html" role="search">
          <label class="sr-only" for="configSearch">Szukaj produktu</label>
          <input id="configSearch" name="q" type="search" placeholder="Czego szukasz?">
          <button type="submit" aria-label="Szukaj">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          </button>
        </form>
        <a class="header-icon" href="javascript:void(0);" onclick="openCartDrawer();" aria-label="Koszyk">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
      </div>
  </header>

  <main>
    <section class="ai-hero">
      <div class="ai-chat-interface">
        
        <div class="chat-history">
          <div class="chat-message">
            <div class="avatar avatar-ai">
              <img class="gemini-icon" src="images/prescot-pattern.png" style="width: 14px; height: 14px; object-fit: contain; margin-left: 4px; vertical-align: middle;">
            </div>
            <div class="message-bubble">
              Cześć! Jestem Twoim wirtualnym doradcą oświetleniowym. Opowiedz mi o swoim projekcie. Co i gdzie chcesz oświetlić? Wpisz np. "Potrzebuję 12m mocnej taśmy COB ciepłej do salonu".
            </div>
          </div>
        </div>

        <div class="ai-input-area">
          <input type="text" placeholder="Twoja kolej! Opisz swój pomysł tutaj..." id="aiChatInput">
          <button type="button" aria-label="Wyślij">
              <img src="images/prescot-pattern.png" style="width: 22px; height: 22px; object-fit: contain; transition: filter 0.2s;" alt="Send">
            </button>
        </div>
      </div>
    </section>
  </main>


  <script src="js/configurator-core.js"></script>
  <script src="js/ai-agent.js"></script>
  <script src="js/smart-search.js"></script>
  <script src="js/shared-popups.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof initSharedPopups === 'function') initSharedPopups();
      
      // Header scroll logic
      const header = document.getElementById('siteHeader');
      function handleScroll() {
        if (window.scrollY > 40) {
          if (header) header.classList.add('scrolled');
        } else {
          if (header) header.classList.remove('scrolled');
        }
      }
      window.addEventListener('scroll', handleScroll, { passive: true });
      handleScroll();

      // Typing background glow logic
      const aiChatInput = document.getElementById('aiChatInput');
      const aiHero = document.querySelector('.ai-hero');
      let typingTimeout;

      if (aiChatInput && aiHero) {
        aiChatInput.addEventListener('input', () => {
          aiHero.classList.add('typing');
          clearTimeout(typingTimeout);
          typingTimeout = setTimeout(() => {
            aiHero.classList.remove('typing');
          }, 400); // Effect lingers for 400ms after last keystroke
        });
      }
    });
  </script>
  <script id="standard-header-scroll-script">
    document.addEventListener('DOMContentLoaded', () => {
      const header = document.getElementById('siteHeader') || document.querySelector('.site-header') || document.querySelector('.mockup-header');
      const headerLogo = document.querySelector('.brand img') || document.querySelector('.mockup-header-logo img');
      function handleScroll() {
        if (window.scrollY > 40) {
          if (header) header.classList.add('scrolled');
          if (headerLogo) headerLogo.src = 'images/logo-dark.png';
        } else {
          if (header) header.classList.remove('scrolled');
          if (headerLogo) headerLogo.src = 'images/logo-white.png';
        }
      }
      window.addEventListener('scroll', handleScroll, { passive: true });
      handleScroll();
    });
  </script>
</body>
</html>
