  <style>
    /* Futuristic AI Chat Design - LLM Style */
    body.ai-shopping-body {
      background: #0b1a30 !important;
      color: #333333 !important;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      margin: 0;
    }
    
    /* Ukryj szary overlay koszyka na stronie AI, żeby można było czytać czat */
    #cartDrawerOverlay {
      background: transparent !important;
      pointer-events: none !important;
      backdrop-filter: none !important;
    }
    
    .site-header {
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .ai-hero {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end; /* Chat box starts near bottom or stretches */
      padding: 100px 20px 40px;
      z-index: 1;
      min-height: calc(100vh - 75px);
    }

    /* Watermark background */
    .ai-hero::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50vw;
      height: 50vw;
      max-width: 500px;
      max-height: 500px;
      background: url('images/logo-white.png') center/contain no-repeat;
      opacity: 0.035; /* Static clean faint watermark */
      z-index: 0;
      pointer-events: none;
    }

    

    /* Chat window styled like a pro LLM */
    .ai-chat-interface {
      width: 100%;
      max-width: 1080px;
      display: flex;
      flex-direction: column;
      height: 100%;
      flex: 1;
    }

    .chat-history {
      display: flex;
      flex-direction: column;
      gap: 24px;
      flex: 1;
      overflow-y: auto;
      padding: 20px 0 40px;
    }

    .chat-history::-webkit-scrollbar {
      width: 6px;
    }
    .chat-history::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
    }

    .chat-message {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      animation: fadeInUp 0.4s ease forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-ai {
      background: #ffffff;
      color: #fff;
    }

    .avatar-user {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .message-bubble {
      padding: 0;
      font-size: 15px;
      line-height: 1.6;
      color: #e2e8f0;
      flex: 1;
      margin-top: 4px;
    }

    /* AI Quick Reply Pills */
    .ai-suggestion-pill {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 8px 16px;
      color: #e2e8f0;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ai-suggestion-pill:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
    }

    .ai-suggestion-pill:focus-visible {
      outline: 2px solid #00d8f5;
      outline-offset: 3px;
    }

    .ai-quick-replies-dynamic {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    
    @media (max-width: 768px) {
      .ai-suggestion-pill {
        padding: 6px 12px;
        font-size: 11px;
      }
    }

    /* Product results keep the store language while making the AI choice explicit. */
    .ai-product-results.shop-page {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      overflow: hidden;
      border: 1px solid rgba(148, 184, 215, 0.2);
      border-radius: 24px;
      background: transparent;
      background-image: linear-gradient(145deg, rgba(255,255,255,.075), rgba(0,216,245,.025) 50%, rgba(232,76,35,.045));
      box-shadow: 0 20px 60px rgba(1, 9, 19, .24);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .ai-recommendation-head {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 5px 4px 13px;
    }

    .ai-recommendation-orbit {
      position: relative;
      display: inline-flex;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(0, 216, 245, .38);
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(145deg, rgba(0, 216, 245, .22), rgba(232, 76, 35, .2));
      box-shadow: 0 0 24px rgba(0, 216, 245, .14);
    }

    .ai-recommendation-orbit::before {
      content: '';
      position: absolute;
      width: 58px;
      height: 16px;
      background: rgba(255,255,255,.28);
      filter: blur(9px);
      transform: rotate(-28deg) translateX(-42px);
      animation: aiOrbitSweep 3.8s ease-in-out infinite;
    }

    .ai-recommendation-orbit i {
      position: relative;
      z-index: 1;
      font-size: 21px;
    }

    .ai-recommendation-heading {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 2px;
    }

    .ai-recommendation-heading span {
      color: #65e9fb;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .ai-recommendation-heading strong {
      overflow: hidden;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 19px;
      letter-spacing: -.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ai-recommendation-count {
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: #cbd8e6;
      background: rgba(4, 15, 28, .45);
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }

    .ai-context-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 0 4px 14px;
    }

    .ai-context-strip span {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: #cbd8e6;
      background: rgba(255,255,255,.055);
      font-size: 10px;
      font-weight: 650;
    }

    .ai-context-strip i {
      color: #38d59b;
      font-size: 13px;
    }

    .ai-products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .ai-product-results .mockup-product-card.ai-recommendation-card {
      position: relative;
      flex-direction: column !important;
      padding: 0 16px 16px !important;
      border-color: rgba(188, 204, 220, .72) !important;
      border-radius: 20px !important;
      box-shadow: 0 14px 36px rgba(0, 8, 18, .16) !important;
      transform: none !important;
      opacity: 1;
      animation: aiCardReveal .55s cubic-bezier(.2,.8,.2,1) backwards;

      transition: transform .28s cubic-bezier(.2,.8,.2,1), border-color .25s ease, box-shadow .25s ease !important;
    }

    .ai-product-results .mockup-product-card.ai-recommendation-card::before {
      content: '';
      position: absolute;
      z-index: 5;
      inset: 0 18% auto;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #00d8f5, #e84c23, transparent);
      opacity: .78;
    }

    .ai-product-results .mockup-product-card.ai-recommendation-card:hover {
      border-color: rgba(0, 171, 207, .65) !important;
      box-shadow: 0 22px 48px rgba(0, 8, 18, .24), 0 0 0 1px rgba(0,216,245,.1) !important;
      transform: translateY(-5px) !important;
    }

    .ai-product-results .mockup-product-media {
      width: calc(100% + 32px) !important;
      margin-right: -16px !important;
      margin-left: -16px !important;
      aspect-ratio: 4 / 3 !important;
    }

    .ai-product-results .mockup-product-img,
    .ai-product-results .mockup-product-card:hover .mockup-product-img {
      aspect-ratio: 4 / 3 !important;
      padding: 20px !important;
    }

    .ai-product-results .mockup-product-card:hover .mockup-product-img {
      transform: scale(1.045) !important;
    }

    .ai-product-results .catalog-product-badges {
      align-items: flex-start;
    }

    .ai-product-results .ai-match-badge {
      display: inline-flex;
      min-height: 26px;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      border: 1px solid rgba(0, 152, 184, .24);
      border-radius: 999px;
      color: #075b72;
      background: rgba(229, 251, 255, .95);
      box-shadow: 0 4px 12px rgba(11, 26, 48, .08);
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .ai-product-results .catalog-stock-badge {
      margin-left: auto;
    }

    .ai-product-results .mockup-product-info {
      flex-direction: column !important;
    }

    .ai-product-role {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 2px 0 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e8eef4;
    }

    .ai-product-role span {
      color: #0b657b;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .ai-product-role small {
      color: #77869a;
      font-size: 10px;
      font-weight: 650;
      white-space: nowrap;
    }

    .ai-product-results .mockup-product-title {
      min-height: 40px;
      -webkit-line-clamp: 2;
    }

    .ai-match-reason {
      display: flex;
      min-height: 34px;
      align-items: flex-start;
      gap: 6px;
      margin: -2px 0 9px;
      color: #63748a;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.4;
    }

    .ai-match-reason i {
      flex: 0 0 auto;
      margin-top: 1px;
      color: #16a66a;
      font-size: 14px;
    }

    .ai-product-details-link {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 5px;
      margin: -3px 0 12px;
      color: #52667d !important;
      font-size: 10.5px;
      font-weight: 750;
      text-decoration: none !important;
    }

    .ai-product-details-link:hover {
      color: #0b1a30 !important;
    }

    .ai-product-details-link i {
      transition: transform .2s ease;
    }

    .ai-product-details-link:hover i {
      transform: translate(2px, -2px);
    }

    .ai-product-results .catalog-card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .ai-product-results .catalog-card-actions > button {
      min-height: 44px;
      border-radius: 11px !important;
      font-size: 10px !important;
      letter-spacing: .02em;
    }

    .ai-cart-confirmation {
      display: flex !important;
      width: 100% !important;
      min-height: 54px;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 12px;
      padding: 0 18px !important;
      border: 1px solid rgba(56, 213, 155, .38) !important;
      border-radius: 15px !important;
      color: #fff !important;
      background: linear-gradient(105deg, rgba(17, 137, 95, .95), rgba(11, 91, 105, .96)) !important;
      box-shadow: 0 14px 34px rgba(0,0,0,.2) !important;
    }

    .ai-cart-confirmation span,
    .ai-cart-confirmation strong {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .ai-cart-confirmation strong {
      font-size: 12px;
    }

    @keyframes aiCardReveal {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes aiOrbitSweep {
      0%, 25% { transform: rotate(-28deg) translateX(-42px); }
      65%, 100% { transform: rotate(-28deg) translateX(42px); }
    }

    @media (max-width: 620px) {
      .ai-product-results.shop-page {
        padding: 10px;
        border-radius: 19px;
      }

      .ai-recommendation-head {
        grid-template-columns: 42px minmax(0, 1fr);
      }

      .ai-recommendation-orbit {
        width: 39px;
        height: 39px;
        border-radius: 12px;
      }

      .ai-recommendation-heading strong {
        font-size: 16px;
      }

      .ai-recommendation-count {
        display: none;
      }

      .ai-products-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .ai-product-results .catalog-card-actions {
        grid-template-columns: 1fr;
      }

      .ai-cart-confirmation {
        align-items: flex-start;
        flex-direction: column;
        padding: 12px 14px !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ai-recommendation-orbit::before,
      .ai-product-results .mockup-product-card.ai-recommendation-card {
        animation: none !important;
      }

      .ai-product-results .mockup-product-card.ai-recommendation-card {
        opacity: 1;
        transform: none !important;
      }
    }

    /* AI input styled like LLM prompt box */
    
    /* --- AI STUDIO GOOGLE STYLE INPUT BAR --- */
    .ai-input-area {
      position: relative;
      margin-top: auto;
      background: #1e293b; /* Base dark background */
      border-radius: 30px; /* Fully rounded pill shape like AI Studio */
      padding: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      z-index: 1; /* For the halo pseudo-elements */
    }

    .ai-input-area input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 16px 60px 16px 24px; /* More padding, room for button */
      color: #fff;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      outline: none;
    }

    .ai-input-area input::placeholder {
      color: #94a3b8;
    }

    /* Send Button */
    .ai-input-area button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 8px;
      width: 44px; /* Larger circular button */
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05); /* Subtle background initially */
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .ai-input-area button:hover {
      background: #0b1a30; /* The brand orange */
      border-color: #0b1a30;
      box-shadow: 0 4px 15px rgba(11, 26, 48, 0.4);
    }
    
    .ai-input-area button:hover img {
      filter: brightness(0) invert(1);
    }

    /* AI Studio Spinning Halo Effect */
    @property --halo-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    
    .ai-input-area::before {
      content: "";
      position: absolute;
      inset: -2px; /* Slightly thicker border for AI Studio look */
      border-radius: 32px; /* Matches the inner pill */
      padding: 2px; /* Border thickness */
      background: rgba(11, 26, 48, 0.8); /* Dark navy base */
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: -1;
    }

    .ai-input-area::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 32px;
      padding: 2px;
      background: conic-gradient(from var(--halo-angle), transparent 0%, #3b82f6 30%, #e84c23 70%, transparent 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: -1;
    }

    .ai-input-area.focused::before {
      opacity: 0;
    }
    .ai-input-area.focused::after {
      opacity: 1;
      animation: spinHalo 4s linear infinite; /* Smooth 4s rotation */
    }
    .ai-input-area.focused {
      box-shadow: 0 8px 30px rgba(11, 26, 48, 0.5), 0 0 15px rgba(11, 26, 48, 0.15);
      background: #151e2e; /* Slightly darker background when focused */
    }

    @keyframes spinHalo {
      to { --halo-angle: 360deg; }
    }
    /* --- END AI STUDIO STYLE --- */

    /* MOBILE BOTTOM NAV CSS */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(20px);

      border-top: 1px solid rgba(255,255,255,0.05);

    }
    .mobile-nav-items {

      height: 65px;
      padding: 0 10px 8px 10px;

    }

    .mobile-nav-item {

      align-items: center;
      justify-content: flex-end;
      text-decoration: none;
      color: #94a3b8;
      flex: 1;
      height: 100%;
      position: relative;
      transition: all 0.3s ease;
    }
    .mobile-nav-item i {
      font-size: 22px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      z-index: 3;
    }
    .mobile-nav-item span {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: color 0.3s ease;
    }
    .mobile-nav-item.active { color: #f8fafc; }
    .mobile-nav-item.active i { color: #f8fafc; }
    .mobile-nav-item:active i { transform: scale(0.9); }

    body.keyboard-open .mobile-bottom-nav,
    body.keyboard-open .ai-quick-replies {
      display: none !important;
    }
    body.keyboard-open .ai-hero {
      padding-bottom: 40px !important;
    }

    @media (max-width: 768px) {
      .mobile-bottom-nav { display: block; }
      .ai-hero { padding-bottom: 90px; } /* Room for mobile bottom nav */
    }

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof initSharedPopups === 'function') initSharedPopups();
      
      // Header scroll logic
      const header = document.getElementById('siteHeader');
      function handleScroll() {
        if (window.scrollY > 40) {
          if (header) header.classList.add('scrolled');
        } else {
          if (header) header.classList.remove('scrolled');
        }
      }
      window.addEventListener('scroll', handleScroll, { passive: true });
      handleScroll();

      // Typing background glow logic
      const aiChatInput = document.getElementById('aiChatInput');
      const aiHero = document.querySelector('.ai-hero');
      const inputArea = document.querySelector('.ai-input-area');
      let typingTimeout;

      if (aiChatInput && aiHero) {
        aiChatInput.addEventListener('input', () => {
          aiHero.classList.add('typing');
          if (inputArea) inputArea.classList.add('focused');
          
          clearTimeout(typingTimeout);
          typingTimeout = setTimeout(() => {
            aiHero.classList.remove('typing');
            // If not focused anymore, remove focused class
            if (document.activeElement !== aiChatInput && inputArea) {
              inputArea.classList.remove('focused');
            }
          }, 400); // Effect lingers for 400ms after last keystroke
        });

        // Hide bottom nav on mobile when input is focused
        aiChatInput.addEventListener('focus', () => {
          document.body.classList.add('keyboard-open');
          if (inputArea) inputArea.classList.add('focused');
        });
        aiChatInput.addEventListener('blur', () => {
          if (inputArea) inputArea.classList.remove('focused');
          setTimeout(() => {
            document.body.classList.remove('keyboard-open');
          }, 100);
        });
      }
    });
  </script>

          if (headerLogo) headerLogo.src = 'images/logo-white.png';
        }
      }
      window.addEventListener('scroll', handleScroll, { passive: true });
      handleScroll();
    });
  </script>
