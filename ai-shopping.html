<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1a30">
  <link rel="icon" type="image/png" href="images/prescot-pattern.png">
  <title>Zakup AI | Prescot LED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/configurator.css">
  
  <style>
    /* Futuristic AI Chat Design - LLM Style */
    body {
      background: #0f172a; /* Ciemny, elegancki granat podobny do IDE/LLM */
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      margin: 0;
    }
    
    .site-header {
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .ai-hero {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end; /* Chat box starts near bottom or stretches */
      padding: 100px 20px 40px;
      z-index: 1;
      min-height: calc(100vh - 75px);
    }

    /* Watermark background */
    .ai-hero::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60vw;
      height: 60vw;
      max-width: 600px;
      max-height: 600px;
      background: url('images/logo-white.png') center/contain no-repeat;
      opacity: 0.02; /* Bardzo delikatny znak wodny */
      z-index: -1;
      pointer-events: none;
    }

    /* Chat window styled like a pro LLM */
    .ai-chat-interface {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      height: 100%;
      flex: 1;
    }

    .chat-history {
      display: flex;
      flex-direction: column;
      gap: 24px;
      flex: 1;
      overflow-y: auto;
      padding: 20px 0 40px;
    }

    .chat-history::-webkit-scrollbar {
      width: 6px;
    }
    .chat-history::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
    }

    .chat-message {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      animation: fadeInUp 0.4s ease forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-ai {
      background: #ffffff;
      color: #fff;
    }

    .avatar-user {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .message-bubble {
      padding: 0;
      font-size: 15px;
      line-height: 1.6;
      color: #e2e8f0;
      flex: 1;
      margin-top: 4px;
    }

    /* AI input styled like LLM prompt box */
    .ai-input-area {
      position: relative;
      margin-top: auto;
      background: #1e293b;
      border: 1px solid transparent;
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .ai-input-area input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 12px 50px 12px 16px;
      color: #fff;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      outline: none;
    }

    .ai-input-area input::placeholder {
      color: #64748b;
    }

    .ai-input-area button {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        right: 8px;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: #ffffff;
        border: 1px solid rgba(0,0,0,0.1);
        display: flex;
        align-items: center;
        justify-content: center;
      }

    .ai-input-area button:hover {
        background: #ff5a00;
      }
      .ai-input-area button:hover img {
        filter: brightness(0) invert(1);
      }

    /* Glow effect for menu link */
    .desktop-nav a.ai-glow-link {
      background: linear-gradient(90deg, #ff5a00, #ff9a64);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      position: relative;
    }
  
    /* Pro Max Animations & Effects */
    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      height: 24px;
    }
    .typing-indicator span {
      width: 6px;
      height: 6px;
      background-color: #64748b;
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    
      .ai-add-all-btn {
        justify-content: center;
        background: #0b1a30 !important;
        color: #ffffff !important;
        text-decoration: none !important;
        font-weight: bold !important;
        border: 1px solid transparent !important;
        margin-top: 12px;
      }
      .ai-add-all-btn:hover {
        background: #ffffff !important;
        color: #0b1a30 !important;
        border: 1px solid #0b1a30 !important;
      }
      .ai-add-all-btn.bought {
        background: #ffffff !important;
        color: #0b1a30 !important;
        border: 1px solid #0b1a30 !important;
      }

      .pro-product-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      padding: 12px;
      border-radius: 12px;
      display: flex;
      gap: 16px;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      opacity: 0;
      transform: translateY(15px);
      animation: fadeInUp 0.5s ease forwards;
    }
    .pro-product-card:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,90,0,0.3);
      box-shadow: 0 10px 30px -10px rgba(255,90,0,0.15);
      transform: translateY(-2px);
    }
    .pro-product-card:nth-child(2) { animation-delay: 0.15s; }
    .pro-product-card:nth-child(3) { animation-delay: 0.3s; }
    .pro-product-card:nth-child(4) { animation-delay: 0.45s; }

    .ai-input-area {
      transition: border-color 0.3s, box-shadow 0.3s;
    }
          @property --halo-angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }
      
      .ai-input-area::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 17px;
        padding: 1px;
        background: rgba(255,255,255,0.1);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        transition: opacity 0.3s;
      }

      .ai-input-area::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 17px;
        padding: 1.5px; /* Slightly thicker for the glow effect */
        background: conic-gradient(from var(--halo-angle, 0deg), transparent 65%, rgba(255,255,255,0.3) 90%, #ff5a00 100%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .ai-input-area.focused::before {
        opacity: 0;
      }
      .ai-input-area.focused::after {
        opacity: 1;
        animation: spinHalo 4.5s linear infinite;
      }
      .ai-input-area.focused {
        box-shadow: 0 4px 25px rgba(255,90,0,0.15);
      }

      @keyframes spinHalo {
        to { --halo-angle: 360deg; }
      }
</style>
</head>
<body>

  <!-- Include existing header here via JS injection or python -->

    <a class="brand" href="index.html" aria-label="Prescot — strona główna">

    </a>
    <nav class="desktop-nav" aria-label="Nawigacja główna">
      <a href="index.html">Home</a>

    <div class="header-actions">

          </button>
        </form>
        <a class="header-icon" href="cart.html" aria-label="Koszyk">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          <span class="cart-badge" id="cartBadge">0</span>

        <button class="menu-button" id="menuButton" type="button" aria-expanded="false" aria-controls="mobileMenu" aria-label="Otwórz menu"><span></span><span></span><span></span></button>
      </div>
      <nav class="mobile-menu" id="mobileMenu" aria-label="Nawigacja mobilna" hidden>
      <a href="index.html">Home</a>
      <a href="shop.html">Sklep</a>
      <a href="blog.html">Wiedza</a>
      <a href="about.html">O nas</a>
      <a href="contact.html">Kontakt</a>
      <a href="configurator.html">Dobierz system</a>
      <a class="active" href="ai-shopping.html"><img class="gemini-icon" src="images/prescot-pattern.png" style="width: 18px; height: 18px; object-fit: contain; margin-right: 6px; vertical-align: middle;">Zakup AI</a>
    </nav>
  </header>

  <main>
    <section class="ai-hero">
      <div class="ai-chat-interface">
        
        <div class="chat-history">
          <div class="chat-message">
            <div class="avatar avatar-ai">
              <img class="gemini-icon" src="images/prescot-pattern.png" style="width: 14px; height: 14px; object-fit: contain; margin-left: 4px; vertical-align: middle;">
            </div>
            <div class="message-bubble">
              Cześć! Jestem Twoim wirtualnym doradcą oświetleniowym. Opowiedz mi o swoim projekcie. Co i gdzie chcesz oświetlić? Wpisz np. "Potrzebuję 12m mocnej taśmy COB ciepłej do salonu".
            </div>
          </div>
        </div>

        <div class="ai-input-area">
          <input type="text" placeholder="Twoja kolej! Opisz swój pomysł tutaj..." id="aiChatInput">
          <button type="button" aria-label="Wyślij">
              <img src="images/prescot-pattern.png" style="width: 22px; height: 22px; object-fit: contain; transition: filter 0.2s;" alt="Send">
            </button>
        </div>
      </div>
    </section>
  </main>


  <script src="js/configurator-core.js"></script>
  <script src="js/ai-agent.js"></script>
  <script src="js/smart-search.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const header = document.getElementById('siteHeader');
      function handleScroll() {
        if (window.scrollY > 40) {
          if (header) header.classList.add('scrolled');
        } else {
          if (header) header.classList.remove('scrolled');
        }
      }
      window.addEventListener('scroll', handleScroll, { passive: true });
      handleScroll();
    });
  </script>
</body>
</html>
